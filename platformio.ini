[platformio]
default_envs = flight_controller

[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps =
  nrf24/RF24@^1.4.8

[env:flight_controller]
build_src_filter = +<common/> +<flight_controller/>

[env:remote_controller]
build_src_filter = +<common/> +<remote_controller/>
